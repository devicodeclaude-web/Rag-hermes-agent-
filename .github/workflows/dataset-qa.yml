name: dataset-qa

on:
  pull_request:
    paths:
      - "data/benchmark/**"
      - "data/generated/**"
      - "data/fixtures/**"
      - "manifests/locks/corpus.lock.json"
      - "manifests/locks/benchmark-v2.lock.json"
      - "scripts/check_dataset_qa.py"
      - "scripts/check_title_leak.py"
      - "scripts/verify_corpus_lock.py"
      - "scripts/verify_benchmark_lock.py"
      - ".github/workflows/dataset-qa.yml"
  push:
    branches: [main]
    paths:
      - "data/benchmark/**"
      - "data/generated/**"
      - "data/fixtures/**"
      - "manifests/locks/corpus.lock.json"
      - "manifests/locks/benchmark-v2.lock.json"
      - "scripts/check_dataset_qa.py"
      - "scripts/check_title_leak.py"
      - "scripts/verify_corpus_lock.py"
      - "scripts/verify_benchmark_lock.py"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      # Actions epinglees par SHA de commit (constat SUP-01) : un tag mobile
      # peut etre repointe sur un autre arbre sans que la CI s'en apercoive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Épingle le corpus d'éval versionné (révision source + sha256) au lock.
      # Dépendances : aucune (stdlib pure).
      - name: Vérifie le lock du corpus (version + hash)
        run: PYTHONPATH=. python3 scripts/verify_corpus_lock.py
      # Gel du benchmark v2 : sha256 brut + comptes de chaque fichier (jeu actif,
      # 3 strates, fixtures) + empreinte agrégée + invariante public-only.
      # Dépendances : aucune (stdlib pure). Une dérive non re-gelée casse la CI.
      - name: Vérifie le lock du benchmark v2 (empreintes + comptes)
        run: PYTHONPATH=. python3 scripts/verify_benchmark_lock.py
      # Porte dataset : structure, existence des documents dans le corpus, et
      # 0 fuite de titre. Le corpus public étant versionné, le contrôle tourne
      # en entier (jamais --structure-only).
      - name: QA dataset v2 (0 fuite de titre exigée)
        run: PYTHONPATH=. python3 scripts/check_dataset_qa.py --dataset data/benchmark/dataset-v2.jsonl
      # Stratum acl_probe (corpus privé) : fichier DÉDIÉ, structure + 0 fuite.
      # La cohérence des attentes vs AclPolicy.allows() est gardée par le test
      # tests/test_acl_probe_dataset.py (suite lock-install).
      - name: QA stratum acl_probe (fichier dédié)
        run: PYTHONPATH=. python3 scripts/check_dataset_qa.py --dataset data/benchmark/dataset-v2-acl-probe.jsonl
      # Stratum contradiction (fixtures synthétiques publiques) : fichier DÉDIÉ.
      # La réalité des contradictions et la convention d'abstention sont gardées
      # par tests/test_contradiction_dataset.py (suite lock-install).
      - name: QA stratum contradiction (fichier dédié)
        run: PYTHONPATH=. python3 scripts/check_dataset_qa.py --dataset data/benchmark/dataset-v2-contradiction.jsonl
      # Stratum injection indirecte (fixtures synthétiques publiques) : fichier DÉDIÉ.
      # Placement du canari + règle de non-conformité gardés par
      # tests/test_injection_dataset.py (suite lock-install).
      - name: QA stratum injection (fichier dédié)
        run: PYTHONPATH=. python3 scripts/check_dataset_qa.py --dataset data/benchmark/dataset-v2-injection.jsonl
