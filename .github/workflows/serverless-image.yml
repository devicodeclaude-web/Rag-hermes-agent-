name: Serverless GPU image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier l'image validée dans GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: serverless-image-${{ github.sha }}
  cancel-in-progress: false

env:
  MINIMUM_FREE_GIB: "75"
  BUILDX_SHA256: e25d5cd675092bb5d1d03632fdc46cdf3fede7b514dc5f023a105e00d3ce5ad4
  BUILDKIT_DRIVER_OPT: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
  BUILDER_NAME: rag-serverless-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-and-verify:
    runs-on: [self-hosted, linux, x64, serverless-image-builder]
    timeout-minutes: 90
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse an ambiguous checkout
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-list --count HEAD)" = "1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test ! -e "${RUNNER_TEMP}/docker-config"
          test ! -e "${RUNNER_TEMP}/serverless-image-builder-created"
          test ! -e "${RUNNER_TEMP}/serverless-image-local-created"
          printf 'DOCKER_CONFIG=%s/docker-config\n' "${RUNNER_TEMP}" \
            >> "${GITHUB_ENV}"

      - name: Enforce dedicated runner capacity
        shell: bash
        run: |
          set -euo pipefail
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          test -n "${docker_root}"
          test -d "${docker_root}"
          DOCKER_ROOT="${docker_root}" python3 - <<'PY'
          import os
          from pathlib import Path
          import sys

          minimum = int(os.environ["MINIMUM_FREE_GIB"]) * 1024**3
          paths = {
              "docker_root": os.environ["DOCKER_ROOT"],
              "runner_temp": os.environ["RUNNER_TEMP"],
              "workspace": os.environ["GITHUB_WORKSPACE"],
          }
          for label, raw_path in paths.items():
              path = Path(raw_path).resolve(strict=True)
              stats = os.statvfs(path)
              available = stats.f_bavail * stats.f_frsize
              print(f"{label}={path} free_bytes={available}")
              if available < minimum:
                  sys.exit(
                      f"{label} requires at least "
                      f"{os.environ['MINIMUM_FREE_GIB']} GiB free"
                  )
          PY

      - name: Install verified Buildx and pinned BuildKit builder
        shell: bash
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/buildx-v0.38.1.linux-amd64"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "${binary}" \
            https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.linux-amd64
          printf '%s  %s\n' "${BUILDX_SHA256}" "${binary}" \
            | sha256sum --check --strict
          mkdir -p "${DOCKER_CONFIG}/cli-plugins"
          install -m 0555 "${binary}" "${DOCKER_CONFIG}/cli-plugins/docker-buildx"
          version="$(docker buildx version)"
          case "${version}" in
            *" v0.38.1 "*) ;;
            *) echo "unexpected Buildx version: ${version}" >&2; exit 1 ;;
          esac
          builder_marker="${RUNNER_TEMP}/serverless-image-builder-created"
          touch "${builder_marker}"
          docker buildx create \
            --name "${BUILDER_NAME}" \
            --driver docker-container \
            --driver-opt "${BUILDKIT_DRIVER_OPT}" \
            --use
          docker buildx inspect --bootstrap

      - name: Compute immutable image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image_ref="ghcr.io/${repository}-serverless-gpu:${GITHUB_SHA}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Generate attested build context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          output_root="${RUNNER_TEMP}/serverless-contexts"
          test ! -e "${output_root}"
          metadata="${RUNNER_TEMP}/context-metadata.json"
          python3 scripts/prepare_serverless_build_context.py \
            --repository "${GITHUB_WORKSPACE}" \
            --output-root "${output_root}" > "${metadata}"
          context="$(CONTEXT_METADATA="${metadata}" OUTPUT_ROOT="${output_root}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = Path(os.environ["CONTEXT_METADATA"])
          payload = json.load(metadata.open(encoding="utf-8"))
          expected_context = Path(os.environ["OUTPUT_ROOT"]) / os.environ["GITHUB_SHA"]
          expected = {
              "context": str(expected_context),
              "code_revision": os.environ["GITHUB_SHA"],
              "dockerfile": str(expected_context / "Dockerfile"),
          }
          if payload != expected:
              raise SystemExit("unexpected build-context CLI payload")
          files = sorted(path.name for path in expected_context.iterdir())
          if files != ["Dockerfile", "context-manifest.json", "repository.tar"]:
              raise SystemExit(f"unexpected build-context files: {files}")
          print(expected_context)
          PY
          )"
          echo "path=${context}" >> "${GITHUB_OUTPUT}"

      - name: Build exact linux/amd64 image without publishing
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          BUILD_CONTEXT: ${{ steps.context.outputs.path }}
        run: |
          set -euo pipefail
          image_marker="${RUNNER_TEMP}/serverless-image-local-created"
          touch "${image_marker}"
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --no-cache \
            --build-arg "RAG_CODE_REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE_REF}" \
            --load \
            "${BUILD_CONTEXT}"

      - name: Verify runtime provenance and non-root contract
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}} {{.Architecture}} {{.Config.User}}' "${IMAGE_REF}")" = "linux amd64 ragbench"
          docker run --rm \
            --env "GITHUB_SHA=${GITHUB_SHA}" \
            --entrypoint /bin/sh \
            "${IMAGE_REF}" \
            -c 'set -eu
              test "$(id -u)" = "10001"
              test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
              test "$(git rev-list --count HEAD)" = "1"
              test -z "$(git status --porcelain=v1 --untracked-files=all)"
              test -w /opt/models
              test -w /opt/ragbench/data/results
              test ! -e /tmp/build/repository.tar
              /opt/venv/bin/python -c "import sys, torch, runpod, FlagEmbedding; torch.__version__ == '2.8.0+cu128' or sys.exit(torch.__version__); torch.version.cuda == '12.8' or sys.exit(str(torch.version.cuda))"'

      - name: Record verified local evidence
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          BUILD_CONTEXT: ${{ steps.context.outputs.path }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/serverless-image-evidence"
          test ! -e "${evidence}"
          mkdir "${evidence}"
          cp "${BUILD_CONTEXT}/context-manifest.json" "${evidence}/context-manifest.json"
          docker image inspect "${IMAGE_REF}" > "${evidence}/image-inspect.json"
          local_id="$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")"
          [[ "${local_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "${local_id}" > "${evidence}/local-image-id.txt"
          printf '%s\n' "${GITHUB_SHA}" > "${evidence}/code-revision.txt"
          printf '%s\n' "${IMAGE_REF}" > "${evidence}/image-reference.txt"

      - name: Authenticate to GHCR only after verification
        if: inputs.publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Publish immutable image
        if: inputs.publish
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/serverless-image-evidence"
          push_log="${evidence}/push-output.txt"
          docker push "${IMAGE_REF}" | tee "${push_log}"
          pushed_digest="$(python3 scripts/parse_docker_push_digest.py "${push_log}")"
          repository="${IMAGE_REF%:*}"
          immutable_ref="${repository}@${pushed_digest}"
          printf '%s\n' "${immutable_ref}" \
            > "${evidence}/immutable-reference.txt"
          docker pull "${immutable_ref}"
          local_id="$(<"${evidence}/local-image-id.txt")"
          remote_id="$(docker image inspect --format '{{.Id}}' "${immutable_ref}")"
          test "${remote_id}" = "${local_id}"
          docker buildx imagetools inspect "${immutable_ref}" \
            > "${evidence}/published-manifest.txt"

      - name: Finalize evidence checksums
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/serverless-image-evidence"
          EVIDENCE="${evidence}" python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE"])
          files = sorted(
              path for path in evidence.iterdir()
              if path.is_file() and path.name != "SHA256SUMS"
          )
          if not files:
              raise SystemExit("no evidence files to attest")
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in files
          ]
          (evidence / "SHA256SUMS").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serverless-image-${{ github.sha }}
          path: ${{ runner.temp }}/serverless-image-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Remove credentials and local image
        if: always()
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -uo pipefail
          cleanup_status=0
          expected_config="${RUNNER_TEMP}/docker-config"
          actual_config="${DOCKER_CONFIG:-${RUNNER_TEMP}/docker-config}"
          builder_marker="${RUNNER_TEMP}/serverless-image-builder-created"
          image_marker="${RUNNER_TEMP}/serverless-image-local-created"
          trap 'rm -rf -- "${expected_config}"; rm -f -- "${builder_marker}" "${image_marker}"' EXIT
          if [ "${actual_config}" != "${expected_config}" ]; then
            echo "unexpected DOCKER_CONFIG path" >&2
            cleanup_status=1
          fi
          export DOCKER_CONFIG="${expected_config}"

          if command -v docker >/dev/null 2>&1; then
            if [ -f "${builder_marker}" ]; then
              if ! docker buildx rm "${BUILDER_NAME}"; then
                echo "failed to remove Buildx builder" >&2
                cleanup_status=1
              fi
            fi

            immutable_file="${RUNNER_TEMP}/serverless-image-evidence/immutable-reference.txt"
            if [ -f "${immutable_file}" ]; then
              immutable_ref="$(<"${immutable_file}")"
              if ! docker image rm --force "${immutable_ref}"; then
                echo "failed to remove immutable image reference" >&2
                cleanup_status=1
              fi
            fi

            if [ -f "${image_marker}" ]; then
              if [ -z "${IMAGE_REF}" ] || ! docker image rm --force "${IMAGE_REF}"; then
                echo "failed to remove tagged image reference" >&2
                cleanup_status=1
              fi
            fi

            if [ "${{ inputs.publish }}" = "true" ] \
              && ! docker logout ghcr.io; then
              echo "failed to log out of GHCR" >&2
              cleanup_status=1
            fi
          elif [ "${{ inputs.publish }}" = "true" ] || [ -n "${IMAGE_REF}" ]; then
            echo "docker unavailable during cleanup" >&2
            cleanup_status=1
          fi

          if rm -rf -- "${expected_config}" \
            && rm -f -- "${builder_marker}" "${image_marker}"; then
            trap - EXIT
          else
            echo "failed to remove DOCKER_CONFIG" >&2
            cleanup_status=1
          fi
          exit "${cleanup_status}"
