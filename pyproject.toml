[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-hermes-agent"
version = "0.1.0"
description = "Harnais RAG francophone sécurisé pour Hermes Agent"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
gpu = [
  "FlagEmbedding==1.3.5",
  "huggingface_hub==0.34.4",
  "transformers==4.57.6",
]

[tool.setuptools]
packages = ["rag_hermes"]
